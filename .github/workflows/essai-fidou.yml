name: Essai Fidou (temporaire)
on: { push: { branches: [essai-fidou] } }
permissions: { contents: write }
jobs:
  e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd essai && npm init -y >/dev/null && npm i xlsx@0.18.5 --silent && node scripts/maj-primes.mjs 2>&1 | while read l; do echo "::notice::$l"; done
      - run: |
          git config user.name lupetti-bot; git config user.email lupetti-bot@users.noreply.github.com
          git add essai/public; git commit -m "essai sortie" && git push || true
